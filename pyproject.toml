[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microbial-colony-counting"
version = "0.1.0"
description = "Reproducible classical and deep-learning microbial colony counting benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8,<5",
  "Pillow>=10",
  "PyYAML>=6",
]

[project.optional-dependencies]
analysis = ["pandas>=2", "scipy>=1.11", "matplotlib>=3.8", "optuna>=3.5"]
deep = ["torch>=2.2", "ultralytics>=8.2"]
app = ["gradio>=6,<7"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
colony-counting = "colony_counting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
